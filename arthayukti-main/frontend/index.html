<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/brand/favicon-16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/brand/favicon-32.svg" />
    <link rel="icon" type="image/svg+xml" sizes="48x48" href="/brand/favicon-48.svg" />
    <meta name="theme-color" content="#0C1C35" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the saved (or system) theme before first paint so the page never flashes the wrong one.
      ;(function () {
        try {
          var saved = window.localStorage.getItem('arthayukti.theme')
          var theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArthaYukti</title>
    <meta
      name="description"
      content="Explainable decision support for families with several money goals: see which goal slips when money runs short, and the smallest verified change that fixes it."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
